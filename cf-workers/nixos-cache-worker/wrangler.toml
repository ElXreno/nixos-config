name = "nixos-cache-worker"
main = "src/worker.js"
compatibility_date = "2026-01-20"
workers_dev = false
preview_urls = false

[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[[routes]]
pattern = "nixos-cache-proxy.elxreno.com"
custom_domain = true
