name = "talos-factory-cf-worker-proxy"
main = "src/index.js"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[[routes]]
pattern = "factory.talos.elxreno.com"
custom_domain = true
