name = "nix-cache-proxy"
main = "src/index.js"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false

[cache]
enabled = true
cross_version_cache = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[[routes]]
pattern = "cache.nixos.elxreno.com"
custom_domain = true

[[vars.UPSTREAMS]]
name = "nixos"
url = "https://cache.nixos.org"
key = "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="

