name: Build NixOS

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.ref }}

jobs:
  discover_jobs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-jobs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Generate Jobs
        id: generate-jobs
        shell: bash
        run: |
          set -euo pipefail
          nix eval --json .#ciMatrix | jq -c '[.[]]' > matrix.json

          echo "Collected $(jq length matrix.json) jobs"
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover_jobs
    if: ${{ needs.discover_jobs.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.discover_jobs.outputs.matrix) }}
    runs-on: ubuntu-24.04${{ matrix.job.arch == 'aarch64' && '-arm' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: wimpysworld/nothing-but-nix@v10
        with:
          nix-permission-edict: true
          hatchet-protocol: "rampage"
          root-safe-haven: "4096" # for runner logs

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://nixos-cache-proxy.elxreno.com
            build-dir = /nix/_build

      - name: Create build directory
        run: sudo mkdir -p /nix/_build && echo "TMPDIR=" >> $GITHUB_ENV

      - name: Force replace cache.nixos.org
        run: sed -i "s|https://cache.nixos.org|https://nixos-cache-proxy.elxreno.com|" ~/.config/nix/nix.conf

      - name: Build ${{ matrix.job.name }} job
        run: nix build -L --no-link --keep-going .#hydraJobs.${{ matrix.job.name }} ${{ matrix.job.additionalBuildArgs }}
