name: Update vendorHash

on:
  pull_request:
    paths:
      - "packages/*/go.mod"
      - "packages/*/go.sum"

permissions: {}

concurrency:
  group: vendor-hash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-hash:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Update vendorHash
        run: bash .github/scripts/vendor-hash.sh

      - name: Push
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "build(deps): update vendorHash"
          git push
