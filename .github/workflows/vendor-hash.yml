name: Update vendorHash

on:
  push:
    branches:
      - "renovate/**"

permissions: {}

concurrency:
  group: vendor-hash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-hash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Look for Go module changes
        id: go
        run: |
          if ! git diff --quiet origin/main...HEAD -- 'packages/*/go.mod' 'packages/*/go.sum'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        if: steps.go.outputs.changed == 'true'

      - name: Update vendorHash
        if: steps.go.outputs.changed == 'true'
        run: bash .github/scripts/vendor-hash.sh

      - name: Push
        if: steps.go.outputs.changed == 'true'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "build(deps): update vendorHash"
          git push
